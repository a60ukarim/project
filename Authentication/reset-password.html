<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Reset Password</title>
</head>
<body>
    <div class="reset-password-container">
        <h2>Reset Password</h2>
        <form method="post" name="forgot-password">
            <table>
                <tr>
                    <td><label for="newps">Enter new password:</label></td>
                    <td><input type="password" name="newps" id="newps" size="25" required></td>
                </tr>
                <tr>
                    <td><label for="cnewps">Confirm password:</label></td>
                    <td><input type="password" name="cnewps" id="cnewps" size="25" required></td>
                </tr>
            </table>
            <br>
            <input type="submit" value="Update Password" class="acc">
        </form>
        <br>
        <p class="right"><a href="login.html">Back to Login</a></p>
    </div>
    <script src="../Script/script.js"></script>
</body>
</html>
