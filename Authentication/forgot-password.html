<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>new password</title>
</head>
<body>
    
    <div class="box2">
    <form method="post" name="forgot-password">
        <table>
            <tr>
                <td><label for="newps">New password:</label></td>
                <td><input type="password" name="newps" id="newps" size="25" required></td>
            </tr>
            <tr>
                <td><label for="cnewps">Confirm password:</label></td>
                <td><input type="password" name="cnewps" id="cnewps" size="25"></td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Accept" class="acc">
    </form>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
