<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>forgot Password</title>
</head>
<body>
    <div class="new-password-container">
        <h2>Forgot Password</h2>
        <form method="post" name="reset-password">
            <table>
                <tr>
                    <td><label for="em">Enter you email:</label></td>
                    <td><input type="email" name="em" id="em" size="25" class="email" placeholder="example@domain.com" required></td>
                </tr>
            </table>
            <br>
            <button type="submit" class="acc">Get Code</button>
        </form>
        <br>
    </div>

    <script src="../Script/script.js"></script>
</body>
</html>
